# Fly.io alternative (SQLite on a persistent volume). Requires a Fly account (card on file).
# Create first:  fly volume create patient_data --size 1 --region iad
app = "carecloud-voice-ai-CHANGE-ME"
primary_region = "iad"

[build]

[env]
  DATABASE_URL = "sqlite:////app/data/patients.db"
  PORT = "8000"
  SEED_DEMO_DATA = "false"

[mounts]
  source = "patient_data"
  destination = "/app/data"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = "off"     # keep it awake so calls never hit a cold start
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    method = "GET"
    path = "/health"
    interval = "30s"
    timeout = "5s"
    grace_period = "10s"

[[vm]]
  memory = "512mb"
  cpu_kind = "shared"
  cpus = 1
